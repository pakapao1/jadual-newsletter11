<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Kalendar Newsletter</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fdf5e6; padding: 20px; }
    .calendar { width: 950px; margin: auto; background: white; border: 4px solid #8b4513; padding: 20px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
    .header { text-align: center; color: #8b4513; font-size: 28px; font-weight: bold; margin-bottom: 15px; }
    .control-box { background: #fff8dc; border: 2px dashed #8b4513; padding: 15px; margin-bottom: 20px; }
    textarea { width: 100%; height: 120px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; border: 1px solid #ccc; }
    .day-header { font-weight: bold; text-align: center; background: #eee; padding: 8px; }
    .day { min-height: 100px; border: 1px solid #ddd; padding: 5px; background: #fff; position: relative; }
    .date-num { font-size: 16px; font-weight: bold; }
    .task { background: #e1f5fe; border-left: 3px solid #03a9f4; padding: 3px; font-size: 10px; margin-top: 3px; }
    .holiday { color: red; font-weight: bold; font-size: 10px; }
  </style>
</head>
<body>

<div class="calendar">
  <div class="header" id="monthHeader"></div>
  <div class="control-box">
    <textarea id="scheduleText"></textarea><br>
    <button onclick="saveAndRefresh()">Simpan & Refresh</button>
  </div>
  <div class="grid" id="calendarGrid"></div>
</div>

<script>
  const grid = document.getElementById("calendarGrid");
  const header = document.getElementById("monthHeader");
  const textarea = document.getElementById("scheduleText");

  async function loadData() {
    try {
      const res = await fetch('/get_schedule');
      textarea.value = await res.text();
      renderCalendar();
    } catch (e) { console.error("Gagal ambil data:", e); }
  }

  function renderCalendar() {
    grid.innerHTML = '<div class="day-header">Ahd</div><div class="day-header">Isn</div><div class="day-header">Sel</div><div class="day-header">Rab</div><div class="day-header">Kha</div><div class="day-header">Jum</div><div class="day-header">Sab</div>';
    
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    header.innerText = now.toLocaleString('ms-MY', { month: 'long', year: 'numeric' }).toUpperCase() + " - NEWSLETTER";

    for (let i = 1; i <= daysInMonth; i++) {
      grid.innerHTML += `<div class="day" id="day-${i}"><span class="date-num">${i}</span><div id="task-${i}"></div></div>`;
    }
    applyLogic();
  }

  function applyLogic() {
    const today = new Date().getDate();
    const lines = textarea.value.split('\n');

    document.querySelectorAll('.day').forEach(el => {
      const num = parseInt(el.querySelector('.date-num').innerText);
      
      // Highlight Hari
      if (num < today) el.style.backgroundColor = "#d4edda";
      if (num === today) el.style.border = "3px solid #28a745";

      // Jumaat Blast
      const dObj = new Date(new Date().getFullYear(), new Date().getMonth(), num);
      if (dObj.getDay() === 5) el.innerHTML += `<div style="color:#d32f2f; font-size:9px;">🚀 Blast</div>`;

      // Cuti & Data (Parse dari text)
      lines.forEach(line => {
        if (line.startsWith(num + " ")) {
          el.style.backgroundColor = "#fff3cd"; // Kuning
          el.innerHTML += `<div class="holiday">${line.split(" ")[1]}</div>`;
        }
      });
    });
  }

  function saveAndRefresh() {
    fetch('/save_schedule', { method: 'POST', body: textarea.value })
      .then(() => location.reload());
  }

  window.onload = loadData;
</script>
</body>
</html>
